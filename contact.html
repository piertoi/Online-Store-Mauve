    <link rel="stylesheet" href="stil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header>
        <div class="container header-container">
            <a href="index.html" class="logo"><img src="409707730_735729255103964_6791570392466760095_n.jpg" alt="Logo Mauve"></a>
            <nav class="main-nav">
                <ul>
                    <li class="dropdown">
                        <a href="produse.html">Produse</a>
                        <ul class="dropdown-content">

                            <li><a href="apa-lavanda.html">Apă de Lavandă</a></li>
                            <li><a href="saculeti-parfumati.html">Săculeți Parfumați</a></li>
                        </ul>
                    </li>
                    <li><a href="despre.html">Despre Noi</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="#" id="cart-button"><i class="fas fa-shopping-cart"></i> Coș (<span id="cart-count">0</span>)</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2>Contactează-ne</h2>
        <p>Ai o întrebare sau o sugestie? Ne-ar plăcea să auzim de la tine!</p>
        
        <form id="contact-form">
            <div class="form-group">
                <label for="nume">Nume:</label>
                <input type="text" id="nume" name="nume" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="mesaj">Mesajul tău:</label>
                <textarea id="mesaj" name="mesaj" rows="5"></textarea>
            </div>
            <button type="submit" class="btn">Trimite Mesajul</button>
        </form>
    </main>

    <footer>
        <div class="container footer-container">
            <p>&copy; 2025 mauve. Toate drepturile rezervate.</p>
            
            <div class="social-links">
                <a href="https://www.facebook.com/profile.php?id=61554594878427" target="_blank" aria-label="Pagina noastră de Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://www.instagram.com/mauveshop.ro" target="_blank" aria-label="Pagina noastră de Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.tiktok.com/@mauveshop.ro?_r=1&_t=ZN-91QRoB3SPW2" target="_blank" aria-label="Pagina noastră de TikTok">
                    <i class="fab fa-tiktok"></i>
                </a>
            </div>
        </div>
    </footer>
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Coșul tău de cumpărături</h2>
            <div id="cart-items-list">
                </div>
            <div id="cart-total">
                <strong>Total: 0 RON</strong>
            </div>
            <button id="checkout-btn" class="btn">Finalizează Comanda</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
